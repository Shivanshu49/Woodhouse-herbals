name: backend-check

on:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-check.yml'
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-check.yml'

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: prisma validate · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend

    # Spin up Postgres for migrate-deploy + (future) integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: woodhouse_test
          POSTGRES_USER: woodhouse
          POSTGRES_PASSWORD: woodhouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U woodhouse -d woodhouse_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://woodhouse:woodhouse_ci@localhost:5432/woodhouse_test?schema=public
      NODE_ENV: development
      # Strong-enough secrets to satisfy env validation in non-prod NODE_ENV.
      JWT_ACCESS_SECRET: ci_access_secret_at_least_eight_chars
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_eight_chars
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Test (node:test)
        run: npm test

      - name: Build
        run: npm run build
