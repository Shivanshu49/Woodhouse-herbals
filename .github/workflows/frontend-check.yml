name: frontend-check

on:
  pull_request:
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-check.yml'
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-check.yml'

# Cancel superseded runs on the same ref so a fast follow-up commit
# does not queue behind a stale build.
concurrency:
  group: frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Build needs SOMETHING for NEXT_PUBLIC_* — the storefront does
          # not currently call the API at build time, so dummy values are
          # safe and prevent leaking real prod URLs.
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_AI_URL: https://ai.example.invalid
          NEXT_PUBLIC_SITE_URL: https://woodhouseherbals.example.invalid
        run: npm run build
