# Wood House Herbals — local developer infrastructure.
#
# Brings up the three stateful services that the Backend / AI-Service rely on:
#   - PostgreSQL 16 (commerce DB + Prisma migrations)
#   - Redis 7        (BullMQ background jobs + rate-limit cache + future sessions)
#   - Meilisearch    (product autocomplete / fuzzy search)
#
# Each service has:
#   - A named volume so data survives container restarts.
#   - A healthcheck so `depends_on: service_healthy` waits for it to be ready.
#   - Ports exposed on localhost only — never expose to 0.0.0.0 in production.
#
# Usage:
#   cp .env.docker .env                       # one-time, edit POSTGRES_PASSWORD
#   docker compose up -d                      # start everything in the background
#   docker compose logs -f postgres redis     # tail logs for one or more services
#   docker compose down                       # stop (volumes survive)
#   docker compose down -v                    # nuke volumes too (loses data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: woodhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woodhouse}
      POSTGRES_USER: ${POSTGRES_USER:-woodhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woodhouse_dev}
      # Locale + collation matter for ILIKE search — pin them.
      LANG: en_US.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woodhouse} -d ${POSTGRES_DB:-woodhouse}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: woodhouse-redis
    restart: unless-stopped
    # Persistence on for BullMQ delayed jobs; production should mount AOF too.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: woodhouse-meili
    restart: unless-stopped
    environment:
      # Dev master key — override in production. The Backend reads MEILI_API_KEY.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-woodhouse_dev_master_key_change_me}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
    name: woodhouse_postgres_data
  redis-data:
    name: woodhouse_redis_data
  meili-data:
    name: woodhouse_meili_data
