# Wood House Herbals — local developer infrastructure.
#
# Brings up the three stateful services that the Backend / AI-Service rely on:
#   - PostgreSQL 16 (commerce DB + Prisma migrations)
#   - Redis 7        (BullMQ background jobs + rate-limit cache + future sessions)
#   - Meilisearch    (product autocomplete / fuzzy search)
#
# All services attach to a single user-defined network `woodhouse_net` so
# they can address each other by service name from inside Docker — useful
# when the Backend itself runs as a sibling container later.
#
# Usage:
#   cp .env.example .env                      # one-time, edit POSTGRES_PASSWORD
#   docker compose up -d                      # start everything in the background
#   docker compose logs -f postgres redis     # tail logs for one or more services
#   docker compose down                       # stop (volumes survive)
#   docker compose down -v                    # nuke volumes too (loses data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: woodhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woodhouse}
      POSTGRES_USER: ${POSTGRES_USER:-woodhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woodhouse_dev}
      LANG: en_US.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - woodhouse_pg:/var/lib/postgresql/data
    networks: [woodhouse_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woodhouse} -d ${POSTGRES_DB:-woodhouse}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: woodhouse-redis
    restart: unless-stopped
    # Persistence on for BullMQ delayed jobs; production should mount AOF too.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - woodhouse_redis:/data
    networks: [woodhouse_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: woodhouse-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - woodhouse_meili:/meili_data
    networks: [woodhouse_net]
    healthcheck:
      # `curl` is preinstalled in the meilisearch image; falls back to a
      # plain HTTP GET against /health which the server answers as 200 OK.
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  woodhouse_pg:
    name: woodhouse_pg
  woodhouse_redis:
    name: woodhouse_redis
  woodhouse_meili:
    name: woodhouse_meili

networks:
  woodhouse_net:
    name: woodhouse_net
    driver: bridge
